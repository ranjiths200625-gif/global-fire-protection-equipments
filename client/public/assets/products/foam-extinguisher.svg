<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foamBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="35%" stop-color="#DC2626" />
      <stop offset="65%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="foamMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444" />
      <stop offset="50%" stop-color="#888" />
      <stop offset="100%" stop-color="#222" />
    </linearGradient>
    <filter id="shadowFoam" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="465" rx="90" ry="14" fill="#000" opacity="0.15" />

  <g filter="url(#shadowFoam)">
    <path d="M140,150 Q140,110 200,110 Q260,110 260,150 L260,410 Q260,440 200,440 Q140,440 140,410 Z" fill="url(#foamBodyGrad)" />
    
    <path d="M135,415 Q135,445 200,445 Q265,445 265,415 L265,435 Q265,452 200,452 Q135,452 135,435 Z" fill="#1A1A1A" />
    
    <!-- Foam Type Label (Cream / Pale Ochre Band) -->
    <rect x="140" y="210" width="120" height="90" fill="#FBF0B9" stroke="#D4AF37" stroke-width="1.5" />
    <rect x="140" y="206" width="120" height="4" fill="#F5B400" />
    <rect x="140" y="300" width="120" height="4" fill="#F5B400" />
    <text x="200" y="245" font-family="'Outfit', sans-serif" font-weight="900" font-size="26" fill="#1F1F1F" text-anchor="middle" letter-spacing="2">FOAM</text>
    <text x="200" y="270" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#333333" text-anchor="middle" letter-spacing="1">FIRE EXTINGUISHER</text>
    <text x="200" y="286" font-family="'Inter', sans-serif" font-size="9" fill="#666666" text-anchor="middle">AFFF FOAM SPRAY</text>
  </g>

  <!-- Valve -->
  <rect x="188" y="90" width="24" height="25" fill="url(#foamMetalGrad)" rx="2" />
  <rect x="180" y="72" width="40" height="22" fill="url(#foamMetalGrad)" rx="4" />
  
  <circle cx="168" cy="80" r="10" fill="#FFF" stroke="#333" stroke-width="2" />
  <path d="M164,78 A6,6 0 0,1 172,78" fill="none" stroke="#22C55E" stroke-width="3" />
  <line x1="168" y1="80" x2="168" y2="74" stroke="#C62828" stroke-width="1.5" stroke-linecap="round" />

  <path d="M175,76 L120,86 Q115,88 120,95 L175,85 Z" fill="#222" />
  <path d="M185,72 L115,50 Q110,48 116,42 L185,62 Z" fill="#C62828" stroke="#8E1B1B" stroke-width="1.5" />
  
  <circle cx="155" cy="67" r="7" fill="none" stroke="#F5B400" stroke-width="2.5" />
  <line x1="162" y1="67" x2="185" y2="67" stroke="#F5B400" stroke-width="2.5" />

  <path d="M220,80 Q290,100 280,240 Q275,320 285,380" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" filter="url(#shadowFoam)" />
  <rect x="278" y="375" width="14" height="30" fill="#333" rx="2" />
</svg>
