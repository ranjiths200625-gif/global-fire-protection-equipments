<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="opBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="600" rx="20" fill="url(#opBg)" />
  <rect x="2" y="2" width="796" height="596" rx="18" fill="none" stroke="#C62828" stroke-width="2" stroke-opacity="0.3" />

  <!-- Header -->
  <rect x="30" y="30" width="740" height="70" rx="12" fill="#181818" stroke="#333" stroke-width="1" />
  <text x="50" y="65" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="1">BASIC FIRE EXTINGUISHER OPERATION</text>
  <text x="50" y="88" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#F5B400">Standard 5-Step General Operation Guide</text>
  
  <!-- Step 1: Check Gauge -->
  <g transform="translate(40, 125)">
    <rect width="225" height="200" rx="12" fill="#181818" stroke="#2B2B2B" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#C62828" />
    <text x="35" y="41" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#FFF" text-anchor="middle">1</text>
    <text x="65" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#FFF">Check Gauge</text>
    
    <!-- Gauge graphic -->
    <circle cx="112" cy="115" r="32" fill="#222" stroke="#444" stroke-width="2" />
    <path d="M96,110 A20,20 0 0,1 128,110" fill="none" stroke="#22C55E" stroke-width="6" />
    <line x1="112" y1="115" x2="112" y2="95" stroke="#F5B400" stroke-width="3" stroke-linecap="round" />
    <text x="112" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#AAA" text-anchor="middle">Ensure needle is in</text>
    <text x="112" y="185" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#22C55E" text-anchor="middle">GREEN operable zone</text>
  </g>

  <!-- Step 2: Pull Pin -->
  <g transform="translate(287, 125)">
    <rect width="225" height="200" rx="12" fill="#181818" stroke="#2B2B2B" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#C62828" />
    <text x="35" y="41" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#FFF" text-anchor="middle">2</text>
    <text x="65" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#FFF">Pull The Pin</text>
    
    <!-- Pin graphic -->
    <circle cx="95" cy="115" r="16" fill="none" stroke="#F5B400" stroke-width="4" />
    <line x1="110" y1="115" x2="150" y2="115" stroke="#F5B400" stroke-width="4" stroke-linecap="round" />
    <!-- Arrow indicating pull -->
    <path d="M70,115 L45,115 M55,107 L45,115 L55,123" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
    
    <text x="112" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#AAA" text-anchor="middle">Pull safety pin to break</text>
    <text x="112" y="185" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FFF" text-anchor="middle">tamper seal mechanism</text>
  </g>

  <!-- Step 3: Aim Base -->
  <g transform="translate(535, 125)">
    <rect width="225" height="200" rx="12" fill="#181818" stroke="#2B2B2B" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#C62828" />
    <text x="35" y="41" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#FFF" text-anchor="middle">3</text>
    <text x="65" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#FFF">Aim At Base</text>
    
    <!-- Aim graphic -->
    <!-- Small Fire -->
    <path d="M150,135 C145,120 135,110 135,95 C145,100 155,90 160,80 C165,95 180,105 180,120 C180,135 165,140 150,135 Z" fill="#EF4444" />
    <path d="M150,135 C148,125 142,120 142,110 C148,115 152,110 155,100 C158,110 168,115 168,125 C168,135 158,138 150,135 Z" fill="#F5B400" />
    <!-- Aiming target -->
    <path d="M70,125 L130,135" fill="none" stroke="#22C55E" stroke-width="3" stroke-dasharray="4,4" />
    <circle cx="150" cy="135" r="8" fill="none" stroke="#22C55E" stroke-width="2" />

    <text x="112" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#AAA" text-anchor="middle">Aim nozzle at base</text>
    <text x="112" y="185" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FFF" text-anchor="middle">of fire, not flames</text>
  </g>

  <!-- Step 4: Squeeze Lever -->
  <g transform="translate(160, 345)">
    <rect width="225" height="200" rx="12" fill="#181818" stroke="#2B2B2B" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#C62828" />
    <text x="35" y="41" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#FFF" text-anchor="middle">4</text>
    <text x="65" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#FFF">Squeeze Lever</text>
    
    <!-- Squeeze Lever Graphic -->
    <path d="M70,95 L140,110 L140,125 L70,110 Z" fill="#333" />
    <path d="M70,80 L140,105" stroke="#C62828" stroke-width="8" stroke-linecap="round" />
    <path d="M100,65 L100,85 M95,78 L100,85 L105,78" fill="none" stroke="#F5B400" stroke-width="3" stroke-linecap="round" />

    <text x="112" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#AAA" text-anchor="middle">Squeeze handle lever</text>
    <text x="112" y="185" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FFF" text-anchor="middle">slowly and evenly</text>
  </g>

  <!-- Step 5: Sweep Side to Side -->
  <g transform="translate(415, 345)">
    <rect width="225" height="200" rx="12" fill="#181818" stroke="#2B2B2B" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#C62828" />
    <text x="35" y="41" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#FFF" text-anchor="middle">5</text>
    <text x="65" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#FFF">Sweep Side-to-Side</text>
    
    <!-- Sweep Graphic -->
    <path d="M60,110 Q112,130 164,110" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="4,4" />
    <path d="M55,110 L65,103 M55,110 L65,117" fill="none" stroke="#38BDF8" stroke-width="3" />
    <path d="M170,110 L160,103 M170,110 L160,117" fill="none" stroke="#38BDF8" stroke-width="3" />
    <ellipse cx="112" cy="115" rx="30" ry="8" fill="#38BDF8" opacity="0.2" />

    <text x="112" y="170" font-family="'Inter', sans-serif" font-size="11" fill="#AAA" text-anchor="middle">Sweep from side to side</text>
    <text x="112" y="185" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FFF" text-anchor="middle">until fire is extinguished</text>
  </g>

  <!-- Safety Warning Bar at Bottom -->
  <rect x="40" y="555" width="720" height="30" rx="6" fill="#2A1010" stroke="#7F1D1D" stroke-width="1" />
  <text x="400" y="575" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#FCA5A5" text-anchor="middle">Safety Note: Only attempt if safe. If fire is uncontrollable, evacuate immediately and dial emergency services.</text>
</svg>
